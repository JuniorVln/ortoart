headline:
  title: "Mais de 15 anos levando precisão e cuidado aos cirurgiões."
history:
  title: "De Curitiba para a rotina dos centros cirúrgicos."
  content: |
    A OrtoArt nasceu em Curitiba com foco em disponibilidade e resposta rápida, próxima aos hospitais e centros cirúrgicos.

    A operação se estruturou em torno de coluna e medicina esportiva, unindo portfólio, técnica e rotina cirúrgica. A empresa consolidou relações com fabricantes de referência para ampliar o acesso a soluções de alta performance.

    Hoje, com mais de quinze anos de mercado e média de 30 cirurgias por dia, a OrtoArt mantém uma equipe preparada para acompanhar cada etapa — da disponibilidade de material ao suporte técnico em sala.
  image: ""
mission:
  content: |
    ## Missão
    Entregar precisão com suporte próximo. Conectar cirurgiões a materiais cirúrgicos de alta performance com organização, disponibilidade e apoio técnico em sala.

    ## Visão
    Ser a referência regional em parceria técnica. Ser lembrada por unir tecnologia, agilidade operacional e relacionamento confiável em cada procedimento.

    ## Valores
    A base que sustenta a operação.

    - Precisão clínica
    - Proximidade no atendimento
    - Responsabilidade técnica
    - Transparência com médicos e hospitais
team:
  title: "Nosso time"
  content: |
    Uma equipe de instrumentadores cirúrgicos, consultores técnicos e profissionais administrativos dedicados a dar suporte completo em cada procedimento.

    - Instrumentação cirúrgica: profissionais presentes em sala para dar fluidez ao centro cirúrgico
    - Suporte técnico: orientação sobre portfólio, aplicação e disponibilidade para cada necessidade clínica
    - Portfólio especializado: soluções para coluna e medicina esportiva com foco em performance e segurança
    - Operação e relacionamento: estrutura local para responder rápido e sustentar relações de longo prazo
  image: ""
