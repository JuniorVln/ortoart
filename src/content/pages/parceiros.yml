headline:
  title: "Representamos o que há de mais moderno no mundo."
positioning:
  content: |
    A OrtoArt aproxima o cirurgião brasileiro de fabricantes reconhecidos globalmente, transformando tecnologia de ponta em disponibilidade real, suporte técnico e resposta ágil no centro cirúrgico.

    Mais do que distribuir marcas, a OrtoArt estrutura um ecossistema de suporte para que médicos, hospitais e equipes tenham acesso a soluções confiáveis, atualização constante e apoio técnico em cada etapa do procedimento.

    Hoje, a representação exclusiva da Orthofix reforça esse papel de curadoria e credibilidade.

    **Fabricantes representados:**
    - Orthofix — representação exclusiva no Sul do Brasil (coluna vertebral)
    - BONSS
    - Hortron
    - Parcus (medicina esportiva)
    - Sintegra (medicina esportiva)
    - Nexxmed
